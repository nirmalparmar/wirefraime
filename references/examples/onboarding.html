<div class="shell shell-centered">
  <div class="center-col">
    <div class="stack stack-sm center">
      <div class="brand"><span class="brand-mark">T</span> Trailhead</div>
    </div>

    <div class="stack stack-sm">
      <div class="spread">
        <p class="text-sm font-medium">Set up your team</p>
        <p class="text-sm text-muted">Step 2 of 3</p>
      </div>
      <div class="progress"><div class="progress-bar w-60"></div></div>
    </div>

    <div class="card stack">
      <div>
        <h2>Invite your teammates</h2>
        <p class="text-sm text-muted">Trailhead works best with your whole crew. You can always invite more people later.</p>
      </div>

      <div class="field">
        <label class="label">Team name</label>
        <input class="input" value="Summit Outdoor Co." />
      </div>

      <div class="field">
        <label class="label">Invite by email</label>
        <input class="input" placeholder="ana@summit.com, leo@summit.com" />
        <p class="hint">Separate multiple addresses with commas.</p>
      </div>

      <div class="field">
        <label class="label">Their role</label>
        <select class="select"><option>Editor — can create and edit trips</option></select>
      </div>

      <hr class="separator" />

      <label class="check-row">
        <input type="checkbox" class="checkbox" checked />
        Send me a copy of the invitation email
      </label>

      <button class="btn btn-primary btn-lg btn-block">Send 2 invitations</button>
      <button class="btn btn-ghost btn-block">Skip for now</button>
    </div>

    <p class="text-xs text-muted center">Invited teammates join free during your trial.</p>
  </div>
</div>
